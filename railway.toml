[build]
buildCommand = "pnpm build"
watchPatterns = ["src/**", "migrations/**", "package.json", "pnpm-lock.yaml", "tsup.config.ts", "tsconfig.json", "railway.toml"]

[deploy]
# Two-track migrate: engine track first, then this repo's client track.
# `scripts/migrate.ts` runs both in order and skips an empty client track
# gracefully. Engine MUST succeed before the API boots (boot guard in
# src/index.ts hard-requires the engine schema).
# Seed is NOT run here — a full re-seed on every deploy is heavy and races itself
# on rapid redeploys (concurrent delete+insert corrupts the dataset). Seed the
# Forgeline demo data once via `pnpm db:seed` (or a scheduled job to roll the
# time-relative window forward). Deploys only migrate.
preDeployCommand = "pnpm db:migrate"
startCommand = "pnpm start"
healthcheckPath = "/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
